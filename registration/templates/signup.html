<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcaBuddy – Sign Up</title>
{% load static %}

<!-- Favicon -->
<link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">

<style>
    body{
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f2f6ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container{
        background: #ffffff;
        width: 350px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        text-align: center;
    }

    h2{
        color: #1e4ed8;
        margin-bottom: 25px;
        font-size: 26px;
    }

    .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #1e4ed8;
        margin-bottom: 25px;
        font-size: 26px;
    }

    .brand img {
        width: 32px;
        height: 32px;
        object-fit: contain;
    }


    input{
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #cfd6e3;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: border 0.2s ease;
    }

    input:focus{
        border: 1px solid #1e4ed8;
    }

    button{
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #1e4ed8;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s ease;
    }

    button:hover{
        background: #163bb8;
    }

    p{
        margin-top: 15px;
        font-size: 14px;
        color: #555;
    }

    a{
        color: #1e4ed8;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover{
        text-decoration: underline;
    }

    .error-message {
        background-color: #ffe5e5;
        color: #d8000c;
        border: 1px solid #d8000c;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-weight: 500;
    }
</style>

</head>
<body>

<div class="container">
    <h2 class="brand">
        <img src="{% static 'images/logo.png' %}">
        AcaBuddy
    </h2>
    <form action = "" method = "post">
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
            {% csrf_token %}
            <input type="text" placeholder="Username" id = 'username' name = 'username' required>
            <input type="email" placeholder="Email" id = 'email' name = 'email' required>
            <input type="password" placeholder="Password" id = 'password1' name = 'password1' required>
            <input type="password" placeholder="Confirm Password" id = 'password2' name = 'password2' required>

            <button type = 'submit'>Sign Up</button>

            <p>Already have an account? <a href="{%url 'login' %}">Log in</a></p>
    </form>
</div>

</body>
</html>
